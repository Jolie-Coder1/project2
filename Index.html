<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Board</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Student Board</h1>
        <p>Student performance dashboard</p>
    </header>

    <main class="container">
        <section class="summary">
            <article class="summary-card">
                <h2>Total Students</h2>
                <p id="student-count">0</p>
            </article>

            <article class="summary-card">
                <h2>Average Score</h2>
                <p id="average-score">0</p>
            </article>

            <article class="summary-card">
                <h2>Top Students</h2>
                <p id="top-students">None</p>
            </article>
        </section>

        <section>
            <h2>Student Records</h2>
            <div id="student-grid" class="student-grid"></div>
        </section>
    </main>

    <footer>
        <p>Student Board Project &copy; 2026</p>
    </footer>
</body>
</html>
